---
- hosts: all
  become: yes

  vars:
    default_dir: /opt/custom

  tasks:
  - name: "INSTALA PACOTE WGET CENTOS"
    yum:
      update_cache: yes
      name: "wget"
      state: present
    when: (ansible_facts['distribution'] == "CentOS")

  - name: "DEFINE HOSTNAME SERVIDORES"
    hostname:
      name: "{{ hostname }}"

  - name: "CRIA DIRETÓRIO PADRÃO NOS SERVIDORES"
    file:
      path: "{{ default_dir }}"
      state: directory

  - name: "CRIA ARQUIVO SIMPLES"
    file:
      path: "{{ default_dir }}/teste.txt"
      state: touch
      owner: davi
      group: davi
      modification_time: preserve
      access_time: preserve

  - name: "CRIA DIRETÓRIO PADRÃO NOS SERVIDORES"
    file:
      path: "{{ item }}"
      state: directory
      owner: davi
      group: davi
    with_items:
    - "/opt/custom/scripts"
    - "/opt/custom/backup"
    - "/opt/custom/log"
    - "/opt/custom/temp"


  - name: "Exemplo de Register"
    shell: "date -u"
    register: data_execucao
  
  - name: "Exibindo Register"
    debug:
      msg: "{{ data_execucao.stdout }}"

