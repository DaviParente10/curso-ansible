---
# tasks file for mysql
- name: Install MariaDB Server - RedHat
  yum:
    name:
      - mariadb-server
      - python3-PyMySQL
    state: present
  when: (ansible_facts['os_family'] == "RedHat")

- name: Install MariaDB Server - Debian
  apt:
    update_cache: yes
    name:
      - mariadb-server
      - python3-pymysql
    state: present
  when: (ansible_facts['os_family'] == "Debian")

- name: "Start MariaDB"
  service:
    name: mariadb
    state: started
    enabled: yes

- name: Criando um banco de dados para ser utilizado pelo WordPres - Debian
  mysql_db:
    login_unix_socket: "/var/run/mysqld/mysqld.sock"
    name: "{{ db_wp_name }}"
    state: present
  when: (ansible_facts['os_family'] == "Debian")

- name: Criando um banco de dados para ser utilizado pelo WordPress - RedHat
  mysql_db:
    login_unix_socket: "/var/lib/mysql/mysql.sock"
    name: "{{ db_wp_name }}"
    state: present
  when: (ansible_facts['os_family'] == "RedHat")

- name: Create user with password, all database privileges in database - Debian
  mysql_user:
    login_unix_socket: "/var/run/mysqld/mysqld.sock"
    name: "{{ db_wp_username }}"
    password: "{{ db_wp_password }}"
    priv: "{{ db_wp_name }}.*:ALL,GRANT"
    state: present
  when: (ansible_facts['os_family'] == "Debian")

- name: Create user with password, all database privileges in database - RedHat
  mysql_user:
    login_unix_socket: "/var/lib/mysql/mysql.sock"  
    name: "{{ db_wp_username }}"
    password: "{{ db_wp_password }}"
    priv: "{{ db_wp_name }}.*:ALL,GRANT"
    state: present
  when: (ansible_facts['os_family'] == "RedHat")

- name: Remove all anonymous user accounts - Debian
  mysql_user:
    login_unix_socket: "/var/run/mysqld/mysqld.sock"
    name: ''
    host_all: yes
    state: absent
  when: (ansible_facts['os_family'] == "Debian")

- name: Remove all anonymous user accounts - RedHat
  mysql_user:
    login_unix_socket: "/var/lib/mysql/mysql.sock"    
    name: ''
    host_all: yes
    state: absent
  when: (ansible_facts['os_family'] == "RedHat")